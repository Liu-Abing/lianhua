<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>莲 · 一株</title>
<style>
  :root{
    --ink:#f4efe6;
    --ink-dim:rgba(244,239,230,.76);
    --ink-faint:rgba(244,239,230,.36);
    --hair:rgba(244,239,230,.18);
    --glass:rgba(10,14,18,.70);
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",serif;
    --sans:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#05070a}
  body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;cursor:default}

  #view{position:fixed;inset:0}
  #view canvas{display:block;width:100%;height:100%}

  /* ---------- 说明面板 ---------- */
  #panel{
    position:fixed; top:50%; z-index:20;
    width:min(440px, 33vw);
    padding:34px 34px 30px;
    background:var(--glass);
    border:1px solid var(--hair);
    backdrop-filter:blur(26px) saturate(1.06);
    text-shadow:0 1px 12px rgba(3,7,11,.62);
    opacity:0; pointer-events:none;
    transition:opacity .55s ease, transform .7s cubic-bezier(.16,.84,.28,1);
  }
  #panel[data-side="left"]{left:clamp(28px,5vw,108px); transform:translateY(-50%) translateX(-46px)}
  #panel[data-side="right"]{right:clamp(28px,5vw,108px); transform:translateY(-50%) translateX(46px)}
  #panel.show{opacity:1; transform:translateY(-50%) translateX(0)}
  #panel::before{content:""; position:absolute; left:34px; top:26px; width:26px; height:1px; background:rgba(244,239,230,.5)}
  #panelTitle{margin:26px 0 0; font:400 26px/1.44 var(--serif); letter-spacing:.06em}
  #panelBody{margin:20px 0 0; font:300 18px/1.85 var(--sans); color:var(--ink-dim); text-align:justify}
  #panelImage{
    display:block; margin:22px auto 0;
    max-width:100%; max-height:34vh; width:auto; height:auto;
    border:1px solid var(--hair); border-radius:2px;
  }
  #panelImage.off{display:none}

  /* ---------- 提示与返回 ---------- */
  #hint{
    position:fixed; left:50%; bottom:36px; z-index:20; transform:translateX(-50%);
    font:300 13.5px/1.8 var(--sans); letter-spacing:.2em; color:var(--ink-faint);
    text-align:center; pointer-events:none; transition:opacity .6s ease;
  }
  #hint b{font-weight:400; color:var(--ink-dim); letter-spacing:.14em}
  #hint.hidden{opacity:0}
  #hint.hidden #goRhizome{pointer-events:none}
  #hint .hintRow{margin-top:11px}
  #goRhizome{
    pointer-events:auto; margin:0; padding:3px 11px; letter-spacing:.14em;
    font:400 12.5px/1.6 var(--sans); color:var(--ink-dim);
    background:rgba(12,16,20,.46); border:1px solid var(--hair); border-radius:999px;
    cursor:pointer; backdrop-filter:blur(10px); transition:color .25s, border-color .25s;
  }
  #goRhizome:hover{color:var(--ink); border-color:rgba(244,239,230,.44)}

  #back{
    position:fixed; left:50%; bottom:32px; z-index:22; transform:translate(-50%,14px);
    padding:11px 24px; font:400 13px/1 var(--sans); letter-spacing:.16em;
    color:var(--ink-dim); background:rgba(10,14,18,.5); border:1px solid var(--hair);
    border-radius:999px; cursor:pointer; backdrop-filter:blur(12px);
    opacity:0; pointer-events:none;
    transition:opacity .45s ease, transform .45s cubic-bezier(.16,.84,.28,1), color .25s, border-color .25s;
  }
  #back.show{opacity:1; pointer-events:auto; transform:translate(-50%,0)}
  #back:hover{color:var(--ink); border-color:rgba(244,239,230,.44)}

  /* ---------- 开场影片 ---------- */
  #intro{
    position:fixed; inset:0; z-index:40; background:#05070a;
    display:flex; align-items:center; justify-content:center;
    opacity:1; transition:opacity .35s ease;
  }
  #intro.hidden{opacity:0; pointer-events:none}
  #introVideo{width:100%; height:100%; object-fit:cover}
  #skip{
    position:absolute; right:28px; bottom:26px; padding:9px 18px;
    font:400 13px/1 var(--sans); color:var(--ink-dim);
    background:rgba(12,16,20,.44); border:1px solid var(--hair); border-radius:999px;
    cursor:pointer; backdrop-filter:blur(10px); transition:color .25s, border-color .25s;
  }
  #skip:hover{color:var(--ink); border-color:rgba(244,239,230,.4)}

  /* ---------- 加载与错误 ---------- */
  #loader{
    position:fixed; inset:0; z-index:50; background:#05070a;
    display:flex; align-items:center; justify-content:center;
    font:300 13px/1 var(--sans); letter-spacing:.3em; color:var(--ink-faint);
    transition:opacity .5s ease;
  }
  #loader.hidden{opacity:0; pointer-events:none}

  #fatal{
    position:fixed; inset:0; z-index:60; background:#05070a;
    display:none; align-items:center; justify-content:center; padding:40px;
  }
  #fatal.show{display:flex}
  #fatal div{max-width:560px; font:300 14px/2 var(--sans); color:var(--ink-dim); text-align:center}
  #fatal b{display:block; margin-bottom:14px; font:400 17px/1.6 var(--serif); color:var(--ink); letter-spacing:.05em}

  @media (max-width:860px){
    #panel{width:auto; left:16px; right:16px; top:auto; bottom:88px; padding:26px 24px 24px}
    #panel[data-side="left"],#panel[data-side="right"]{transform:translateY(30px)}
    #panel.show{transform:translateY(0)}
    #panelTitle{font-size:21px}
    #panelBody{font-size:17px; line-height:1.8}
  }
</style>
</head>
<body>

<div id="view"></div>

<aside id="panel" data-side="left">
  <h2 id="panelTitle"></h2>
  <p id="panelBody"></p>
  <img id="panelImage" class="off" alt="">
</aside>

<div id="hint">
  <span>拖动旋转 &nbsp;·&nbsp; 右键或双指拖动可平移 &nbsp;·&nbsp; 点击<b>花瓣 莲蓬 荷叶</b>、点击<b>泥土</b>扒开找藕</span>
  <div class="hintRow"><button id="goRhizome" type="button">直接去水底看藕</button></div>
</div>
<button id="back" type="button">返回全景</button>

<div id="intro" class="hidden">
  <video id="introVideo" muted autoplay playsinline></video>
  <button id="skip" type="button">跳过</button>
</div>

<div id="loader">莲</div>
<div id="fatal"><div><b>场景没能启动</b>这个页面需要通过本地服务打开。<br>回到文件夹，双击 <code>启动.bat</code> 即可。</div></div>

<script>
  /* 用普通脚本做兜底：模块加载失败时给出可操作的提示，而不是白屏 */
  window.__lotusReady = false;
  window.__lotusFail = function (msg) {
    var el = document.getElementById('fatal');
    if (el && !window.__lotusReady) {
      el.classList.add('show');
      var box = el.querySelector('div');
      if (msg && box) box.insertAdjacentHTML('beforeend', '<br><span style="opacity:.6;font-size:12px">' + msg + '</span>');
    }
  };
  window.addEventListener('error', function (e) { window.__lotusFail(e.message || ''); });
  setTimeout(function () { if (!window.__lotusReady) window.__lotusFail(''); }, 6000);
</script>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>

</body>
</html>
